layout: {qmk_keyboard: corne_rotated, layout_name: LAYOUT_split_3x6_3}
layers:
  base:
    - TAB
    - Q
    - W
    - E
    - R
    - T
    - Y
    - U
    - I
    - O
    - P
    - ESC
    - {t: LALT, h: 2x CAPS}
    - A
    - S
    - D
    - F
    - G
    - H
    - J
    - K
    - L
    - ";"
    - "'"
    - LCTRL
    - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - ","
    - "."
    - "/"
    - LCTRL
    - {t: ESC, h: LGUI}
    - {t: SPACE, h: NAV}
    - {t: DEL, h: NAV2}
    - {t: RET, h: FUN}
    - {t: BSPC, h: NUM}
    - {t: LSHFT, h: sticky}

  num:
    - LG(GRAVE)
    - "!"
    - "@"
    - "#"
    - "$"
    - "%"
    - "^"
    - "&"
    - "*"
    - "("
    - ")"
    - G
    - {t: LALT, h: sticky}
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    - '0'
    - LCTRL
    - {t: LCTRL, h: sticky}
    - {t: LCTRL, h: sticky}
    - {t: LALT, h: sticky}
    - {t: LGUI, h: sticky}
    - {t: LSHFT, h: sticky}
    - '&g_'
    - {t: RSHFT, h: sticky}
    - {t: RGUI, h: sticky}
    - {t: RALT, h: sticky}
    - {t: RCTRL, h: sticky}
    - ''
    - LSHFT
    - {t: ESC, h: LGUI}
    - SPACE
    - DOT
    - RET
    - BSPC
    - DEL

  nav:
    - GRAVE
    - TMUX_LAST_WINDOW
    - TMUX_PREV_WINDOW
    - TMUX_NEXT_WINDOW
    - TMUX_CHOOSE_WINDOW
    - TMUX_NEW_WINDOW
    - TMUX_JOIN_PREV_WINDOW
    - TMUX_PASTE_BUFFER
    - ''
    - ''
    - ''
    - ESC
    - {t: LALT, h: sticky}
    - {t: LCTRL, h: sticky}
    - {t: LALT, h: sticky}
    - {t: LGUI, h: sticky}
    - {t: LSHFT, h: sticky}
    - TMUX_COPY_MODE
    - LEFT
    - DOWN
    - UP
    - RIGHT
    - ''
    - LCTRL
    - {t: LCTRL, h: sticky}
    - TMUX_ZOOM
    - TMUX_SPLIT_H
    - TMUX_SPLIT_V
    - TMUX_BREAK_PANE
    - TMUX_PREV_PANE
    - HOME
    - PG_UP
    - PG_DN
    - END
    - ''
    - LSHFT
    - {t: ESC, h: LGUI}
    - SPACE
    - DOT
    - RET
    - BSPC
    - DEL

  fun:
    - CAPS
    - F1
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    - F8
    - F9
    - F10
    - ESC
    - {t: LALT, h: sticky}
    - F11
    - F12
    - PREV
    - PLAY_PAUSE
    - NEXT
    - VOL_DN
    - MUTE
    - VOL_UP
    - ''
    - ''
    - LCTRL
    - {t: LCTRL, h: sticky}
    - LC(LG(LS(N1)))
    - LC(LG(LS(N2)))
    - LC(LG(LS(N3)))
    - LC(LG(LS(N4)))
    - LC(LG(LS(N5)))
    - BT 0
    - BT 1
    - BT 2
    - BT 3
    - BT CLR
    - LSHFT
    - {t: ESC, h: LGUI}
    - SPACE
    - LALT
    - RET
    - BSPC
    - DEL

  nav2:
    - {t: LALT, h: TAB cycle}
    - LG(SPACE)
    - LG(LS(LBKT))
    - LG(LS(RBKT))
    - LA(SPACE)
    - ESC
    - ''
    - ''
    - ''
    - ''
    - ''
    - ESC
    - {t: LALT, h: sticky}
    - BSPC
    - LS(RET)
    - LC(RET)
    - RET
    - DEL
    - LA(H)
    - LA(J)
    - LA(K)
    - LA(L)
    - ''
    - LCTRL
    - {t: LCTRL, h: sticky}
    - LC(LG(LS(N1)))
    - LC(LG(LS(N2)))
    - LC(LG(LS(N3)))
    - LC(LG(LS(N4)))
    - LC(LG(LS(N5)))
    - SCROLL_LEFT
    - SCROLL_DOWN
    - SCROLL_UP
    - SCROLL_RIGHT
    - ''
    - LSHFT
    - {t: ESC, h: LGUI}
    - SPACE
    - LALT
    - LCLK
    - RCLK
    - MCLK
combos:
  - {p: [31, 32], k: "(", l: [base]}
  - {p: [32, 33], k: ")", l: [base]}
  - {p: [19, 20], k: "[", l: [base]}
  - {p: [20, 21], k: "]", l: [base]}
  - {p: [15, 28], k: BSLH, l: [base, num]}
  - {p: [7, 8], k: LS(RET), l: [base, num]}
  - {p: [8, 9], k: TILDE_SPACE, l: [base, num]}
  - {p: [14, 15], k: LC(SPACE), l: [base, num]}
  - {p: [16, 15], k: COLON, l: [base]}
  - {p: [4, 3], k: UNDER, l: [base, num]}
  - {p: [17, 29], k: MINUS, l: [base, num]}
  - {p: [2, 3], k: QMARK, l: [base, num]}
  - {p: [28, 27], k: EQUAL, l: [base, num]}
  - {p: [18, 30], k: PIPE, l: [base, num]}
  - {p: [27, 26], k: LC(X), l: [base, num]}
  - {p: [16, 28], k: PLUS, l: [base, num]}
  - {p: [7, 19], k: TILDE, l: [base]}
  - {p: [19, 8], k: QTSPC, l: [base, num]}
  - {p: [20, 31], k: FSLH, l: [base, num]}
